name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
