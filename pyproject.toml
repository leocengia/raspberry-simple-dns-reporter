[project]
name = "raspberry-simple-dns-reporter"
version = "0.2.0"
description = "A lightweight, read-only Pi-hole DNS activity reporter with NetAlertX enrichment."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Leonardo Cengia" }]
dependencies = []

[project.scripts]
dns-reporter = "dns_reporter.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
dns_reporter = ["config/*.json", "web/*"]
